plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group

base { archivesName = project.archives_base_name }

// Cog cell: compiled java is the materialized gen/ tree (scripts/cog-gen.ps1 -KeepCellResources);
// this cell keeps its own pack.mcmeta/mixins.json/manifest, and gets shared lang from gen/ (D16).
sourceSets.main.java.srcDirs = ['gen/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    compileOnly localRuntime("net.fabricmc:fabric-loader:${project.loader_version}")
    compileOnly localRuntime("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
    // gson (shipped with MC) references these annotations; present at compile time only,
    // so -Xlint:all classfile warnings don't fire on gson's class files.
    compileOnly "com.google.errorprone:error_prone_annotations:2.36.0"
}

processResources {
    def packFormat = (System.getenv("PACK_FORMAT") ?: "84")
    inputs.properties(["version": project.version, "mcLower": project.mc_lower, "mcUpper": project.mc_upper, "packFormat": packFormat])
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mcLower": project.mc_lower, "mcUpper": project.mc_upper
    }
    filesMatching("pack.mcmeta") {
        expand "packFormat": packFormat
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.doFirst { options.compilerArgs += ["-Xlint:all"] }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
