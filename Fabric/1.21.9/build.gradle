plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16-SNAPSHOT'
}

version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // gson (shipped with MC) references these annotations; compile-time only (silences -Xlint:all
    // classfile warnings on gson's class files).
    compileOnly "com.google.errorprone:error_prone_annotations:2.36.0"
}

processResources {
    inputs.properties(["version": project.version, "mcDep": project.mc_dep])
    filesMatching("fabric.mod.json") { expand "version": project.version, "mcDep": project.mc_dep }
}

tasks.withType(JavaCompile).configureEach { it.options.encoding = "UTF-8"; it.options.release = 21; it.options.compilerArgs += ["-Xlint:all"] }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Cog cell: compiled source is the materialized gen/ tree (scripts/cog-gen.ps1), never shared_* directly.
sourceSets.main.java.srcDirs = ['gen/src/main/java']
sourceSets.main.resources.srcDirs = ['src/main/resources', 'gen/src/main/resources']
