  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"bb1fb3ac-da99-46c7-ac91-c8947f507cd3\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic */\n@font-face {\n  font-family: 'Pixelify Sans';\n  font-style: normal;\n  font-weight: 400 700;\n  font-display: swap;\n  src: url(\"51ee286d-14dd-4bc8-9fd8-bb19b5d3d090\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Pixelify Sans';\n  font-style: normal;\n  font-weight: 400 700;\n  font-display: swap;\n  src: url(\"0bd7e4d1-be58-49b8-8705-5d30b913a6fe\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Pixelify Sans';\n  font-style: normal;\n  font-weight: 400 700;\n  font-display: swap;\n  src: url(\"0cd3dec2-35de-4642-9b84-7f76c8264a02\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  @keyframes mc-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }\n  input { font-family: inherit; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#1a1a1a;background-image:repeating-linear-gradient(45deg,#1d1d1d 0,#1d1d1d 2px,#191919 2px,#191919 4px);padding:48px;box-sizing:border-box;font-family:'Pixelify Sans',monospace;\">\n\n  <div style=\"margin-bottom:40px;\">\n    <div style=\"display:flex;align-items:center;gap:16px;\">\n      <div style=\"width:40px;height:40px;background:#6c8f3a;box-shadow:inset 4px 4px 0 #8fb85a,inset -4px -4px 0 #46622a,0 0 0 4px #000;\"><\u002Fdiv>\n      <div>\n        <div style=\"font-size:34px;color:#fff;letter-spacing:3px;text-shadow:3px 3px 0 #000;\">ULTIMATE SLEEP<\u002Fdiv>\n        <div style=\"font-size:18px;color:#8f8f8f;letter-spacing:1px;margin-top:4px;\">In-game config GUI · Minecraft Java · mockups shown at 3× GUI scale (panel = 256×180 GUI px)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;justify-content:flex-start;\">\n\n    <!-- ============ 9 PAGES + ADMIN VARIANTS (data-driven) ============ -->\n    <sc-for list=\"{{ pages }}\" as=\"page\" hint-placeholder-count=\"11\">\n      <div style=\"flex:none;width:768px;\">\n        <div style=\"font-size:17px;color:#9a9a9a;margin-bottom:10px;letter-spacing:1px;\">{{ page.frameLabel }}<\u002Fdiv>\n\n        <div style=\"position:relative;width:768px;height:540px;background:#121212;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 6px #2f2f2f;color:#e6e6e6;overflow:visible;\">\n\n          <!-- TITLE STRIP -->\n          <div style=\"height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#1c1c1c;box-shadow:inset 0 -3px 0 #000;\">\n            <div style=\"display:flex;align-items:center;gap:12px;\">\n              <div style=\"width:30px;height:30px;background:#6c8f3a;box-shadow:inset 3px 3px 0 #8fb85a,inset -3px -3px 0 #46622a,0 0 0 3px #000;\"><\u002Fdiv>\n              <span style=\"font-size:15px;letter-spacing:2px;color:#b9b9b9;text-shadow:2px 2px 0 #000;white-space:nowrap;\">ULTIMATE SLEEP<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:26px;color:#ffffff;text-shadow:2px 2px 0 #000;\">{{ page.title }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- CONTENT: standard rows -->\n          <sc-if value=\"{{ page.notAdmin }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"position:relative;height:420px;padding:18px 24px;\">\n              <sc-for list=\"{{ page.rows }}\" as=\"row\" hint-placeholder-count=\"5\">\n                <div onmouseenter=\"{{ row.onEnter }}\" onmouseleave=\"{{ row.onLeave }}\" style=\"position:relative;display:flex;align-items:center;justify-content:space-between;min-height:54px;margin-bottom:12px;padding:0 6px;\" style-hover=\"background:#1b1b1b;\">\n                  <div style=\"font-size:21px;color:#d6d6d6;text-shadow:2px 2px 0 #000;max-width:380px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{ row.label }}<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:12px;\">\n\n                    <!-- TOGGLE -->\n                    <sc-if value=\"{{ row.isToggle }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button onclick=\"{{ row.onToggle }}\" style=\"display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 18px;min-width:124px;justify-content:center;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-family:inherit;font-size:21px;border:none;cursor:pointer;\" style-hover=\"background:#9c9c9c;box-shadow:inset 3px 3px 0 #c8c8c8,inset -3px -3px 0 #565656,0 0 0 3px #000;\" style-active=\"box-shadow:inset -3px -3px 0 #b6b6b6,inset 3px 3px 0 #4d4d4d,0 0 0 3px #000;\">\n                        <sc-if value=\"{{ row.on }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:16px;height:16px;background:#54fb54;box-shadow:0 0 0 2px #1c3a1c;\"><\u002Fspan><span style=\"color:#54fb54;text-shadow:2px 2px 0 #173017;\">ON<\u002Fspan><\u002Fsc-if>\n                        <sc-if value=\"{{ row.notOn }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:16px;height:16px;background:#5a5a5a;box-shadow:0 0 0 2px #2a2a2a;\"><\u002Fspan><span style=\"color:#9a9a9a;text-shadow:2px 2px 0 #1c1c1c;\">OFF<\u002Fspan><\u002Fsc-if>\n                      <\u002Fbutton>\n                    <\u002Fsc-if>\n\n                    <!-- SELECTION (cycle) -->\n                    <sc-if value=\"{{ row.isSelect }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button onclick=\"{{ row.onCycle }}\" style=\"display:inline-flex;align-items:center;gap:12px;height:54px;padding:0 16px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-family:inherit;font-size:20px;border:none;cursor:pointer;\" style-hover=\"background:#9c9c9c;box-shadow:inset 3px 3px 0 #c8c8c8,inset -3px -3px 0 #565656,0 0 0 3px #000;\" style-active=\"box-shadow:inset -3px -3px 0 #b6b6b6,inset 3px 3px 0 #4d4d4d,0 0 0 3px #000;\">\n                        <span style=\"color:#cfcfcf;text-shadow:2px 2px 0 #2a2a2a;\">‹<\u002Fspan>\n                        <span style=\"color:#ffe14d;text-shadow:2px 2px 0 #4a3c10;\">{{ row.valStr }}<\u002Fspan>\n                        <span style=\"color:#cfcfcf;text-shadow:2px 2px 0 #2a2a2a;\">›<\u002Fspan>\n                      <\u002Fbutton>\n                    <\u002Fsc-if>\n\n                    <!-- TEXT FIELD -->\n                    <sc-if value=\"{{ row.isText }}\" hint-placeholder-val=\"{{ true }}\">\n                      <input value=\"{{ row.cur }}\" oninput=\"{{ row.onInput }}\" style=\"width:118px;height:54px;background:#000;box-shadow:0 0 0 3px #a0a0a0;border:none;color:#e6e6e6;font-size:21px;text-shadow:2px 2px 0 #111;padding:0 10px;outline:none;\" style-focus=\"box-shadow:0 0 0 3px #ffffff;color:#ffffff;\">\n                    <\u002Fsc-if>\n\n                    <!-- REWARD: toggle + inline numeric fields -->\n                    <sc-if value=\"{{ row.isReward }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button onclick=\"{{ row.onToggle }}\" style=\"display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 16px;min-width:110px;justify-content:center;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-family:inherit;font-size:21px;border:none;cursor:pointer;\" style-hover=\"background:#9c9c9c;box-shadow:inset 3px 3px 0 #c8c8c8,inset -3px -3px 0 #565656,0 0 0 3px #000;\">\n                        <sc-if value=\"{{ row.on }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:16px;height:16px;background:#54fb54;box-shadow:0 0 0 2px #1c3a1c;\"><\u002Fspan><span style=\"color:#54fb54;text-shadow:2px 2px 0 #173017;\">ON<\u002Fspan><\u002Fsc-if>\n                        <sc-if value=\"{{ row.notOn }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:16px;height:16px;background:#5a5a5a;box-shadow:0 0 0 2px #2a2a2a;\"><\u002Fspan><span style=\"color:#9a9a9a;text-shadow:2px 2px 0 #1c1c1c;\">OFF<\u002Fspan><\u002Fsc-if>\n                      <\u002Fbutton>\n                      <sc-for list=\"{{ row.extras }}\" as=\"ex\" hint-placeholder-count=\"0\">\n                        <span style=\"font-size:18px;color:#8f8f8f;text-shadow:2px 2px 0 #000;\">{{ ex.label }}<\u002Fspan>\n                        <input value=\"{{ ex.cur }}\" oninput=\"{{ ex.onInput }}\" style=\"width:70px;height:54px;background:#000;box-shadow:0 0 0 3px #a0a0a0;border:none;color:#e6e6e6;font-size:21px;text-align:center;padding:0 6px;outline:none;\" style-focus=\"box-shadow:0 0 0 3px #ffffff;color:#ffffff;\">\n                      <\u002Fsc-for>\n                    <\u002Fsc-if>\n\n                  <\u002Fdiv>\n\n                  <!-- TOOLTIP -->\n                  <sc-if value=\"{{ row.showTip }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"position:absolute;top:56px;right:0;z-index:60;max-width:430px;padding:9px 14px;background:#160024;box-shadow:0 0 0 3px #160024,0 0 0 6px #3a0d6b;color:#efe6ff;font-size:18px;text-shadow:2px 2px 0 #000;line-height:1.35;pointer-events:none;\">{{ row.tip }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- CONTENT: admin LIVE (partial scroll) -->\n          <sc-if value=\"{{ page.adminLive }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"position:relative;height:420px;padding:18px 24px;\">\n              <div style=\"position:relative;height:288px;background:#0a0a0a;box-shadow:0 0 0 3px #000;overflow:hidden;\">\n                <div style=\"position:absolute;left:0;right:0;top:0;padding:6px 30px 6px 6px;transform:translateY(-72px);\">\n                  <sc-for list=\"{{ admins }}\" as=\"a\" hint-placeholder-count=\"6\">\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:6px;padding:0 12px;background:#181818;box-shadow:inset 0 0 0 3px #000;\">\n                      <span style=\"font-size:21px;color:#d6d6d6;text-shadow:2px 2px 0 #000;\">{{ a.name }}<\u002Fspan>\n                      <button onclick=\"{{ a.onRemove }}\" style=\"width:42px;height:42px;background:#a04444;box-shadow:inset 3px 3px 0 #c86868,inset -3px -3px 0 #6e2c2c,0 0 0 3px #000;color:#fff;font-size:22px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;\" style-hover=\"background:#bb5050;\" style-active=\"box-shadow:inset -3px -3px 0 #c86868,inset 3px 3px 0 #6e2c2c,0 0 0 3px #000;\">✕<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <!-- scrollbar -->\n                <div style=\"position:absolute;top:0;right:0;width:18px;height:100%;background:#000;\"><\u002Fdiv>\n                <div style=\"position:absolute;right:0;top:96px;width:18px;height:96px;background:#9a9a9a;box-shadow:inset 3px 3px 0 #c4c4c4,inset -3px -3px 0 #5a5a5a,0 0 0 3px #000;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;margin-top:18px;\">\n                <input value=\"{{ newAdmin }}\" oninput=\"{{ onNewInput }}\" placeholder=\"player name…\" style=\"flex:1;height:54px;background:#000;box-shadow:0 0 0 3px #a0a0a0;border:none;color:#e6e6e6;font-size:21px;text-shadow:2px 2px 0 #111;padding:0 12px;outline:none;\" style-focus=\"box-shadow:0 0 0 3px #ffffff;color:#fff;\">\n                <button onclick=\"{{ onAdd }}\" style=\"height:54px;padding:0 28px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:21px;border:none;cursor:pointer;\" style-hover=\"background:#9c9c9c;\" style-active=\"box-shadow:inset -3px -3px 0 #b6b6b6,inset 3px 3px 0 #4d4d4d,0 0 0 3px #000;\">Add<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- CONTENT: admin FULL (scrolled to end) -->\n          <sc-if value=\"{{ page.adminFull }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"position:relative;height:420px;padding:18px 24px;\">\n              <div style=\"position:relative;height:288px;background:#0a0a0a;box-shadow:0 0 0 3px #000;overflow:hidden;\">\n                <div style=\"position:absolute;left:0;right:0;top:0;padding:6px 30px 6px 6px;transform:translateY(-216px);\">\n                  <sc-for list=\"{{ fullList }}\" as=\"a\" hint-placeholder-count=\"8\">\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:6px;padding:0 12px;background:#181818;box-shadow:inset 0 0 0 3px #000;\">\n                      <span style=\"font-size:21px;color:#d6d6d6;text-shadow:2px 2px 0 #000;\">{{ a.name }}<\u002Fspan>\n                      <button style=\"width:42px;height:42px;background:#a04444;box-shadow:inset 3px 3px 0 #c86868,inset -3px -3px 0 #6e2c2c,0 0 0 3px #000;color:#fff;font-size:22px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;\">✕<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"position:absolute;top:0;right:0;width:18px;height:100%;background:#000;\"><\u002Fdiv>\n                <div style=\"position:absolute;right:0;top:186px;width:18px;height:102px;background:#9a9a9a;box-shadow:inset 3px 3px 0 #c4c4c4,inset -3px -3px 0 #5a5a5a,0 0 0 3px #000;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;margin-top:18px;\">\n                <input placeholder=\"player name…\" style=\"flex:1;height:54px;background:#000;box-shadow:0 0 0 3px #a0a0a0;border:none;color:#e6e6e6;font-size:21px;padding:0 12px;outline:none;\">\n                <button style=\"height:54px;padding:0 28px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:21px;border:none;cursor:pointer;\">Add<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- CONTENT: admin EMPTY -->\n          <sc-if value=\"{{ page.adminEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"position:relative;height:420px;padding:18px 24px;\">\n              <div style=\"position:relative;height:288px;background:#0a0a0a;box-shadow:0 0 0 3px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;\">\n                <div style=\"width:46px;height:46px;background:#2a2a2a;box-shadow:inset 3px 3px 0 #3a3a3a,inset -3px -3px 0 #161616,0 0 0 3px #000;\"><\u002Fdiv>\n                <div style=\"font-size:21px;color:#7f7f7f;text-shadow:2px 2px 0 #000;\">No sleep admins configured<\u002Fdiv>\n                <div style=\"font-size:17px;color:#5e5e5e;\">Add a player below to grant sleep-admin powers.<\u002Fdiv>\n                <div style=\"position:absolute;top:0;right:0;width:18px;height:100%;background:#000;\"><\u002Fdiv>\n                <div style=\"position:absolute;right:0;top:0;width:18px;height:100%;background:#3a3a3a;box-shadow:inset 3px 3px 0 #4a4a4a,inset -3px -3px 0 #262626,0 0 0 3px #000;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;margin-top:18px;\">\n                <input placeholder=\"player name…\" style=\"flex:1;height:54px;background:#000;box-shadow:0 0 0 3px #ffffff;border:none;color:#fff;font-size:21px;padding:0 12px;outline:none;\" value=\"Steve\">\n                <button style=\"height:54px;padding:0 28px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:21px;border:none;cursor:pointer;\">Add<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- BOTTOM NAV STRIP -->\n          <div style=\"position:absolute;left:0;right:0;bottom:0;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#1c1c1c;box-shadow:inset 0 3px 0 #000;\">\n            <sc-if value=\"{{ page.notFirst }}\" hint-placeholder-val=\"{{ true }}\">\n              <button style=\"height:48px;padding:0 18px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:19px;border:none;cursor:pointer;\" style-hover=\"background:#9c9c9c;\">‹ Prev<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ page.isFirst }}\" hint-placeholder-val=\"{{ true }}\">\n              <button disabled=\"\" style=\"height:48px;padding:0 18px;background:#4a4a4a;box-shadow:inset 3px 3px 0 #585858,inset -3px -3px 0 #3a3a3a,0 0 0 3px #000;color:#7a7a7a;font-size:19px;border:none;cursor:default;\">‹ Prev<\u002Fbutton>\n            <\u002Fsc-if>\n\n            <div style=\"position:absolute;left:0;right:0;text-align:center;font-size:18px;color:#b9b9b9;text-shadow:2px 2px 0 #000;pointer-events:none;\">{{ page.pageLabel }}<\u002Fdiv>\n\n            <div style=\"display:flex;gap:12px;\">\n              <sc-if value=\"{{ page.notLast }}\" hint-placeholder-val=\"{{ true }}\">\n                <button style=\"height:48px;padding:0 18px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:19px;border:none;cursor:pointer;\" style-hover=\"background:#9c9c9c;\">Next ›<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ page.isLast }}\" hint-placeholder-val=\"{{ true }}\">\n                <button disabled=\"\" style=\"height:48px;padding:0 18px;background:#4a4a4a;box-shadow:inset 3px 3px 0 #585858,inset -3px -3px 0 #3a3a3a,0 0 0 3px #000;color:#7a7a7a;font-size:19px;border:none;cursor:default;\">Next ›<\u002Fbutton>\n              <\u002Fsc-if>\n              <button style=\"height:48px;padding:0 22px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:19px;border:none;cursor:pointer;\" style-hover=\"background:#9c9c9c;\">Done<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <!-- ============ VOTE POPUP ============ -->\n    <div style=\"flex:none;width:600px;\">\n      <div style=\"font-size:17px;color:#9a9a9a;margin-bottom:10px;letter-spacing:1px;\">In-world vote popup · 200×90 GUI px (shown 3×)<\u002Fdiv>\n      <div style=\"position:relative;width:600px;height:270px;background:#121212;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 6px #2f2f2f;color:#e6e6e6;\">\n        <div style=\"height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#1c1c1c;box-shadow:inset 0 -3px 0 #000;\">\n          <span style=\"font-size:18px;letter-spacing:2px;color:#b9b9b9;text-shadow:2px 2px 0 #000;\">SLEEP VOTE<\u002Fspan>\n          <span style=\"font-size:22px;color:#ffe14d;text-shadow:2px 2px 0 #4a3c10;\">29s<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:18px 24px;\">\n          <div style=\"font-size:24px;color:#fff;text-align:center;text-shadow:2px 2px 0 #000;margin-bottom:18px;\">Allow other players to sleep?<\u002Fdiv>\n          <div style=\"display:flex;gap:16px;margin-bottom:16px;\">\n            <button style=\"flex:1;height:66px;background:#5f9a3f;box-shadow:inset 3px 3px 0 #86c45f,inset -3px -3px 0 #3c662a,0 0 0 3px #000;color:#fff;font-size:26px;border:none;cursor:pointer;text-shadow:2px 2px 0 #2c4a1e;\" style-hover=\"background:#6cab48;\" style-active=\"box-shadow:inset -3px -3px 0 #86c45f,inset 3px 3px 0 #3c662a,0 0 0 3px #000;\">YEA<\u002Fbutton>\n            <button style=\"flex:1;height:66px;background:#b04a4a;box-shadow:inset 3px 3px 0 #d98484,inset -3px -3px 0 #743030,0 0 0 3px #000;color:#fff;font-size:26px;border:none;cursor:pointer;text-shadow:2px 2px 0 #5a2424;\" style-hover=\"background:#c25454;\" style-active=\"box-shadow:inset -3px -3px 0 #d98484,inset 3px 3px 0 #743030,0 0 0 3px #000;\">NAY<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"height:14px;background:#000;box-shadow:0 0 0 3px #000;margin-bottom:14px;\">\n            <div style=\"width:48%;height:100%;background:#5f9a3f;box-shadow:inset 0 3px 0 #86c45f;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n            <span style=\"font-size:19px;color:#9a9a9a;text-shadow:2px 2px 0 #000;\">2 of 4 players sleeping<\u002Fspan>\n            <div style=\"display:flex;gap:6px;\">\n              <span style=\"width:18px;height:18px;background:#54fb54;box-shadow:0 0 0 2px #173017;\"><\u002Fspan>\n              <span style=\"width:18px;height:18px;background:#54fb54;box-shadow:0 0 0 2px #173017;\"><\u002Fspan>\n              <span style=\"width:18px;height:18px;background:#3a3a3a;box-shadow:0 0 0 2px #1c1c1c;\"><\u002Fspan>\n              <span style=\"width:18px;height:18px;background:#3a3a3a;box-shadow:0 0 0 2px #1c1c1c;\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============ SHARED STYLE SHEET ============ -->\n    <div style=\"flex:none;width:768px;\">\n      <div style=\"font-size:17px;color:#9a9a9a;margin-bottom:10px;letter-spacing:1px;\">Shared style sheet · widget states &amp; tokens<\u002Fdiv>\n      <div style=\"width:768px;background:#121212;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 6px #2f2f2f;color:#e6e6e6;padding:26px 30px;\">\n        <div style=\"font-size:24px;color:#fff;text-shadow:2px 2px 0 #000;margin-bottom:22px;\">SHARED STYLE SHEET<\u002Fdiv>\n\n        <div style=\"font-size:16px;color:#8f8f8f;letter-spacing:1px;margin-bottom:12px;\">BUTTON STATES<\u002Fdiv>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;\">\n          <div style=\"text-align:center;\"><button style=\"height:54px;padding:0 22px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:20px;border:none;\">Button<\u002Fbutton><div style=\"font-size:14px;color:#7f7f7f;margin-top:8px;\">normal<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;\"><button style=\"height:54px;padding:0 22px;background:#9c9c9c;box-shadow:inset 3px 3px 0 #c8c8c8,inset -3px -3px 0 #565656,0 0 0 3px #000;color:#fff;font-size:20px;border:none;\">Button<\u002Fbutton><div style=\"font-size:14px;color:#7f7f7f;margin-top:8px;\">hover<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;\"><button style=\"height:54px;padding:0 22px;background:#8a8a8a;box-shadow:inset -3px -3px 0 #b6b6b6,inset 3px 3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:20px;border:none;\">Button<\u002Fbutton><div style=\"font-size:14px;color:#7f7f7f;margin-top:8px;\">pressed<\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:center;\"><button style=\"height:54px;padding:0 22px;background:#4a4a4a;box-shadow:inset 3px 3px 0 #585858,inset -3px -3px 0 #3a3a3a,0 0 0 3px #000;color:#7a7a7a;font-size:20px;border:none;\">Button<\u002Fbutton><div style=\"font-size:14px;color:#7f7f7f;margin-top:8px;\">disabled<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:48px;flex-wrap:wrap;margin-bottom:24px;\">\n          <div>\n            <div style=\"font-size:16px;color:#8f8f8f;letter-spacing:1px;margin-bottom:12px;\">TOGGLE<\u002Fdiv>\n            <div style=\"display:flex;gap:12px;\">\n              <button style=\"display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 18px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:21px;border:none;\"><span style=\"width:16px;height:16px;background:#54fb54;box-shadow:0 0 0 2px #1c3a1c;\"><\u002Fspan><span style=\"color:#54fb54;\">ON<\u002Fspan><\u002Fbutton>\n              <button style=\"display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 18px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:21px;border:none;\"><span style=\"width:16px;height:16px;background:#5a5a5a;box-shadow:0 0 0 2px #2a2a2a;\"><\u002Fspan><span style=\"color:#9a9a9a;\">OFF<\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:16px;color:#8f8f8f;letter-spacing:1px;margin-bottom:12px;\">SELECTION<\u002Fdiv>\n            <button style=\"display:inline-flex;align-items:center;gap:12px;height:54px;padding:0 16px;background:#8a8a8a;box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #4d4d4d,0 0 0 3px #000;color:#fff;font-size:20px;border:none;\"><span style=\"color:#cfcfcf;\">‹<\u002Fspan><span style=\"color:#ffe14d;\">SIMPLE<\u002Fspan><span style=\"color:#cfcfcf;\">›<\u002Fspan><\u002Fbutton>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:16px;color:#8f8f8f;letter-spacing:1px;margin-bottom:12px;\">TEXT FIELD<\u002Fdiv>\n            <div style=\"display:flex;gap:12px;\">\n              <input value=\"50%\" readonly=\"\" style=\"width:110px;height:54px;background:#000;box-shadow:0 0 0 3px #a0a0a0;border:none;color:#e6e6e6;font-size:21px;padding:0 10px;outline:none;\">\n              <div style=\"display:inline-flex;align-items:center;width:110px;height:54px;background:#000;box-shadow:0 0 0 3px #ffffff;color:#fff;font-size:21px;padding:0 10px;\">50%<span style=\"animation:mc-blink 1s steps(1) infinite;margin-left:1px;\">_<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;color:#7f7f7f;margin-top:8px;\">normal · focused (white border + caret)<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start;\">\n          <div>\n            <div style=\"font-size:16px;color:#8f8f8f;letter-spacing:1px;margin-bottom:12px;\">SCROLLBAR<\u002Fdiv>\n            <div style=\"position:relative;width:60px;height:120px;background:#000;box-shadow:0 0 0 3px #000;\">\n              <div style=\"position:absolute;right:0;top:0;width:18px;height:100%;background:#000;\"><\u002Fdiv>\n              <div style=\"position:absolute;right:0;top:30px;width:18px;height:54px;background:#9a9a9a;box-shadow:inset 3px 3px 0 #c4c4c4,inset -3px -3px 0 #5a5a5a,0 0 0 3px #000;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:16px;color:#8f8f8f;letter-spacing:1px;margin-bottom:12px;\">TOOLTIP<\u002Fdiv>\n            <div style=\"display:inline-block;padding:9px 14px;background:#160024;box-shadow:0 0 0 3px #160024,0 0 0 6px #3a0d6b;color:#efe6ff;font-size:18px;text-shadow:2px 2px 0 #000;\">Accepts 50, 50% or 1/2.<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:16px;color:#8f8f8f;letter-spacing:1px;margin-bottom:12px;\">COLOR TOKENS<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;max-width:340px;\">\n              <div style=\"text-align:center;\"><div style=\"width:44px;height:44px;background:#54fb54;box-shadow:0 0 0 3px #000;\"><\u002Fdiv><div style=\"font-size:12px;color:#7f7f7f;margin-top:4px;\">ON<\u002Fdiv><\u002Fdiv>\n              <div style=\"text-align:center;\"><div style=\"width:44px;height:44px;background:#9a9a9a;box-shadow:0 0 0 3px #000;\"><\u002Fdiv><div style=\"font-size:12px;color:#7f7f7f;margin-top:4px;\">OFF<\u002Fdiv><\u002Fdiv>\n              <div style=\"text-align:center;\"><div style=\"width:44px;height:44px;background:#ffe14d;box-shadow:0 0 0 3px #000;\"><\u002Fdiv><div style=\"font-size:12px;color:#7f7f7f;margin-top:4px;\">choice<\u002Fdiv><\u002Fdiv>\n              <div style=\"text-align:center;\"><div style=\"width:44px;height:44px;background:#b04a4a;box-shadow:0 0 0 3px #000;\"><\u002Fdiv><div style=\"font-size:12px;color:#7f7f7f;margin-top:4px;\">danger<\u002Fdiv><\u002Fdiv>\n              <div style=\"text-align:center;\"><div style=\"width:44px;height:44px;background:#8a8a8a;box-shadow:0 0 0 3px #000;\"><\u002Fdiv><div style=\"font-size:12px;color:#7f7f7f;margin-top:4px;\">widget<\u002Fdiv><\u002Fdiv>\n              <div style=\"text-align:center;\"><div style=\"width:44px;height:44px;background:#121212;box-shadow:0 0 0 3px #000;\"><\u002Fdiv><div style=\"font-size:12px;color:#7f7f7f;margin-top:4px;\">panel<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  PAGES = [\n    { n:1, title:'General', rows:[\n      { label:'Mod enabled', kind:'toggle', def:true, tip:'Master on/off switch for the Ultimate Sleep mod.' },\n    ]},\n    { n:2, title:'Sleep Engine', rows:[\n      { label:'Requirement mode', kind:'select', opts:['SIMPLE','VOTE'], def:'SIMPLE', tip:'SIMPLE = a fixed % of players must sleep. VOTE = run a sleep vote.' },\n      { label:'Required sleep %', kind:'text', def:'50%', tip:'Accepts 50, 50% or 1/2.' },\n      { label:'Exclude AFK from req.', kind:'toggle', def:true, tip:'AFK players are not counted toward the requirement.' },\n      { label:'Skip mode', kind:'select', opts:['INSTANT','ACCELERATE'], def:'INSTANT', tip:'INSTANT jumps to dawn. ACCELERATE speeds time forward.' },\n      { label:'Accelerate multiplier', kind:'text', def:'100', tip:'Time-speed multiplier used by ACCELERATE skip mode.' },\n      { label:'Preserve weather', kind:'toggle', def:false, tip:'Keep current weather instead of clearing it on wake.' },\n    ]},\n    { n:3, title:'Voting', rows:[\n      { label:'Vote duration (s)', kind:'text', def:'60', tip:'How many seconds a sleep vote stays open.' },\n      { label:'Pass rule', kind:'select', opts:['MAJORITY_CAST','PERCENT_CAST','MAJORITY_NON_AFK'], def:'MAJORITY_CAST', tip:'How a vote is judged to pass.' },\n      { label:'Pass percentage', kind:'text', def:'50%', tip:'Threshold used when pass rule is PERCENT_CAST.' },\n    ]},\n    { n:4, title:'Accessibility', rows:[\n      { label:'Sleep anytime', kind:'toggle', def:false, tip:'Allow players to sleep during the day.' },\n      { label:'Ignore monsters', kind:'toggle', def:false, tip:'Permit sleep even when monsters are nearby.' },\n      { label:'Ignore bed too far', kind:'toggle', def:false, tip:'Remove the \"bed too far away\" restriction.' },\n      { label:'Highlight blocking mobs', kind:'toggle', def:true, tip:'Outline mobs that are preventing players from sleeping.' },\n    ]},\n    { n:5, title:'Feedback', rows:[\n      { label:'Show sleepers in chat', kind:'toggle', def:true, tip:'Post the sleeping-player count to chat.' },\n      { label:'Show sleepers on vote screen', kind:'toggle', def:true, tip:'List who is sleeping on the vote popup.' },\n      { label:'Notify on wake', kind:'toggle', def:true, tip:'Send a message when the night is skipped.' },\n    ]},\n    { n:6, title:'Rewards', rows:[\n      { label:'Regeneration', kind:'reward', def:true, extra:[{key:'min',label:'min',def:'5'}], tip:'Grant Regeneration to players on wake.' },\n      { label:'Golden carrot', kind:'reward', def:false, extra:[], tip:'Give each player a golden carrot on wake.' },\n      { label:'Speed boost', kind:'reward', def:true, extra:[{key:'pct',label:'%',def:'120'},{key:'min',label:'min',def:'3'}], tip:'Grant a temporary speed boost on wake.' },\n    ]},\n    { n:7, title:'World Progression', rows:[\n      { label:'World progression', kind:'toggle', def:true, tip:'Advance world systems while players sleep.' },\n      { label:'Crops grow', kind:'toggle', def:true, tip:'Tick crop growth during sleep.' },\n      { label:'Animal husbandry', kind:'toggle', def:true, tip:'Tick breeding and baby-animal growth during sleep.' },\n      { label:'Smelting', kind:'toggle', def:false, tip:'Advance furnace smelting during sleep.' },\n      { label:'Despawn timers', kind:'toggle', def:true, tip:'Advance item and mob despawn timers during sleep.' },\n    ]},\n    { n:8, title:'Auto-sleep & AFK', rows:[\n      { label:'Auto-sleep', kind:'toggle', def:false, tip:'Players placed in a bed sleep automatically.' },\n      { label:'AFK threshold (s)', kind:'text', def:'300', tip:'Idle seconds before a player is marked AFK.' },\n      { label:'Provide /afk command', kind:'toggle', def:true, tip:'Register the /afk command for players.' },\n    ]},\n    { n:9, title:'Sleep Admins', isAdmin:true, variant:'live' },\n    { n:9, title:'Sleep Admins', isAdmin:true, variant:'full', frameLabel:'Page 9 · Sleep Admins — full list (scrolled to end)' },\n    { n:9, title:'Sleep Admins', isAdmin:true, variant:'empty', frameLabel:'Page 9 · Sleep Admins — empty state' },\n  ];\n\n  state = { ov:{}, tip:'1.1', admins:['Notch','jeb_','Dinnerbone','Grumm','Searge','kingbdogz'], newAdmin:'' };\n\n  renderVals() {\n    const ov = this.state.ov, tip = this.state.tip;\n    const set = (id,v) => this.setState(s => ({ ov:{ ...s.ov, [id]:v } }));\n\n    const pages = this.PAGES.map((p,pi) => {\n      const variant = p.variant || 'live';\n      const base = {\n        n:p.n, title:p.title,\n        isAdmin:!!p.isAdmin, notAdmin:!p.isAdmin,\n        adminLive: !!p.isAdmin && variant==='live',\n        adminFull: !!p.isAdmin && variant==='full',\n        adminEmpty: !!p.isAdmin && variant==='empty',\n        isFirst:p.n===1, notFirst:p.n!==1,\n        isLast:p.n===9, notLast:p.n!==9,\n        pageLabel:'Page '+p.n+' of 9',\n        frameLabel: p.frameLabel || ('Page '+p.n+' · '+p.title),\n      };\n      base.rows = (p.rows||[]).map((r,ri) => {\n        const id = pi+'.'+ri;\n        const cur = (ov[id] !== undefined) ? ov[id] : r.def;\n        const o = {\n          id, label:r.label, tip:r.tip, showTip: tip===id,\n          isToggle:r.kind==='toggle', isSelect:r.kind==='select',\n          isText:r.kind==='text', isReward:r.kind==='reward',\n          onEnter:()=>this.setState({tip:id}), onLeave:()=>this.setState({tip:null}),\n        };\n        if (r.kind==='toggle' || r.kind==='reward') {\n          o.on = !!cur; o.notOn = !cur; o.onToggle = ()=>set(id,!cur);\n        }\n        if (r.kind==='select') {\n          o.valStr = cur;\n          o.onCycle = ()=>{ const i=r.opts.indexOf(cur); set(id, r.opts[(i+1)%r.opts.length]); };\n        }\n        if (r.kind==='text') {\n          o.cur = String(cur); o.onInput = (e)=>set(id, e.target.value);\n        }\n        if (r.kind==='reward') {\n          o.extras = (r.extra||[]).map(x => {\n            const eid = id+':'+x.key;\n            const ec = (ov[eid] !== undefined) ? ov[eid] : x.def;\n            return { label:x.label, cur:String(ec), onInput:(e)=>set(eid, e.target.value) };\n          });\n        }\n        return o;\n      });\n      return base;\n    });\n\n    const admins = this.state.admins.map((nm,i) => ({\n      name:nm,\n      onRemove:()=>this.setState(s=>({ admins:s.admins.filter((_,j)=>j!==i) })),\n    }));\n    const fullList = ['Notch','jeb_','Dinnerbone','Grumm','Searge','kingbdogz','Slicedlime','Mojang_Xilef']\n      .map(n => ({ name:n }));\n\n    return {\n      pages, admins, fullList,\n      newAdmin:this.state.newAdmin,\n      onNewInput:(e)=>this.setState({ newAdmin:e.target.value }),\n      onAdd:()=>{ const n=this.state.newAdmin.trim(); if(n) this.setState(s=>({ admins:[...s.admins, n], newAdmin:'' })); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
